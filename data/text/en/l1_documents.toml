# Lot L1 (chapters 1 and 2): the fragments F01 to F06 and the two encrypted documents, English.
# A fragment opens with the header of the document (kind, sender, date), then two to four
# sentences, and its last word leaves a question open. A document title is what the list of
# the archives shows while it is still sealed; the fragment it yields has its own title.

[doc.doc_phase2]
title = "Nameless transmission"

[doc.doc_ledger]
title = "Market register"

[frag.f01]
title = "Invoice No. 7741"
body = "INVOICE No. 7741. Issuer: Nexus Corp, neurotechnology division. Recipient: MegaCorp Industries. Item: 4,000,000 secure elements, model HALCYON, delivery staggered through 2088. Clause 9: no name and no function on the packaging. Handwritten in the margin: Sector 7 first."

[frag.f02]
title = "Staff Register"
body = "STAFF REGISTER, MegaCorp Industries, security architecture. Departures, 2085. CHEN, M., known as Razor, principal security architect: resignation accepted, name struck through in red. Last signature on file: final specification of the NX-H secure element. Nobody ever asked what it was for."

[frag.f03]
title = "Halcyon Brochure"
body = "HALCYON. Sleep better. Live better. Free installation at your nearest Aurora Dawn clinic, Sector 7 residents only. A discreet implant, a gentle adjustment every night, a softer morning. No forms, no follow-up, nothing to do on your part. Tonight, we take care of everything."

[frag.f04]
title = "Black Ledger"
body = "BLACK LEDGER, Underground Market, Sector 7. Line 212: MegaCorp Industries pays the Aurora Dawn clinics every month, under the heading SLEEP. Patients pay nothing. Line 213: same amount, same clinics, paid by Nexus Corp. In the margin, in R4Z0R's hand: nobody spends this much to give sleep away. So what are they buying?"

[frag.f05]
title = "Intercepted Transmission"
body = "TRANSMISSION, Nexus Corp internal network. Cipher: a simple shift, applied by someone in a hurry. Decrypted text: Phase 2 of Project Aurora approved. Deployment scheduled for Sector 7. Date to be set by the Directorate. Phase 2 of what, exactly?"

[frag.f06]
title = "Orphan File: Aoyama, R."
body = "ORPHAN FILE, shelf 7-B-12. AOYAMA, Ren, Dr, chief neurologist, Project Aurora. Death: \"laboratory accident\", 2085. Autopsy: none on file. Report signed by: nobody. Sealed by order of the Directorate. Filed by Data Miner, for lack of an owner. What kind of accident needs a seal?"
