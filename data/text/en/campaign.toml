# Texts of the campaign game (the hub), English: help, status, listings, prompts, outcomes.
# Keys are the table path plus the name; `name@sr` and `name@ascii` are variants of `name`.
# Glossary terms are never typed here: they arrive as arguments (`{quest}`, `{net}`...), and
# `{term^}` opens a sentence with a capital. The narrative texts (titles, dialogues, messages,
# fragments...) are not here: their keys are derived from the data (world_*.toml).

