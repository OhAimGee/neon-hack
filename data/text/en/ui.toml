# Texts of the interface (ui, gauges, bands, contacts), English.
# Keys are the table path plus the name; `name@sr` and `name@ascii` are variants of `name`.
# Templates: {name}, and {count|singular|plural} (see docs/design/architecture-rust.md, section 6).

[ui]
raw = "{value}"
tagged = "{tag} {text}"
say = "{speaker} » {text}"
"say@ascii" = "{speaker}: {text}"
"say@sr" = "{speaker}: {text}"
invalid_input = "That input is not valid here."
invalid_choice = "Choose one of the listed numbers or names."
invalid_confirm = "Please answer yes or no."
eof = "Input closed: ending the session."

[ui.tag]
alert = "[ALERT]"
reward = "[Reward]"
error = "[Error]"

[ui.gauge]
up = "{gauge} +{delta} ({from} → {to}, {band})."
"up@sr" = "{gauge} up by {delta}, from {from} to {to}, level {band}."
down = "{gauge} -{delta} ({from} → {to}, {band})."
"down@sr" = "{gauge} down by {delta}, from {from} to {to}, level {band}."

[ui.prompt]
command = "> "
choice = "? "
text = "{label}: "
text_default = "{label} [{default}]: "
confirm = "{question} {hint} "
continue = "[Enter] to continue"

[ui.hint]
yes_default = "[Y/n]"
no_default = "[y/N]"

[ui.choice]
unavailable = "{label} ({reason})"

[ui.sr]
cell = "{column}: {value}"

[ui.tui]
too_small = "Terminal too small ({width}x{height}): at least {min_width}x{min_height} needed."
"too_small@sr" = "Terminal too small: {width} columns by {height} lines, at least {min_width} by {min_height} needed."
press_key = "Press any key to leave."
log_title = "{terminal^}"
panel_title = "{panel^}"
panel_more = "... {rows} more {rows|row|rows}"
panel_shown = "{panel^} shown."
panel_hidden = "{panel^} hidden."
modal_hint = "Esc closes"
modal_hint_scroll = "{first}-{last}/{total} | PgUp/PgDn scroll | Esc closes"
modal_empty = "Nothing to list."
switched_to_plain = "Line-by-line display. The game is exactly as you left it."
help = "F2 panel | Tab complete | Ctrl+C quit | Up/Down history | PgUp/PgDn scroll"
scrolled = "[Scrolled back: {rows} {rows|line|lines} below. End or Esc to return.]"

[ui.tui.fx]
skip = "Press any key to skip."
defences = "{ice} {pips}"
percent = "{percent}%"

[ui.tui.fx.hack]
title = "{run^}: {name}"
status = "Hack in progress, {percent}% done, {site} security: {security}"
done = "Access gained, {n} {n|file|files} taken."
done_empty = "Access gained, nothing new to take."
status_done = "Hack complete, {percent}% done, {site} security: {security}"

[ui.tui.fx.hack.phase]
1 = "Scanning ports"
2 = "Bypassing the defences"
3 = "Injecting the payload"
4 = "Escalating privileges"
5 = "Extracting files"

[ui.tui.fx.security]
1 = "minimal"
2 = "low"
3 = "moderate"
4 = "high"
5 = "critical"
6 = "extreme"

[ui.tui.fx.laylow]
title = "Lie low"
status = "Covering your tracks, {percent}% done"
status_done = "Tracks covered, {percent}% done"
notoriety = "{gauge}: {value}"
done = "Tracks covered, {notoriety} -{cooling}."

[ui.tui.fx.laylow.phase]
1 = "Wiping the logs"
2 = "Scrambling the relays"
3 = "New cover in place"

[ui.tui.fx.decrypt]
title = "Decrypting: {name}"
status = "Decryption in progress, {percent}% done"
status_done = "Decryption complete, {percent}% done"
done = "{document^} decrypted."
done_fragment = "{document^} decrypted, new {fragment} in the {archives}."

[ui.tui.fx.decrypt.phase]
1 = "Reading the header"
2 = "Looking for the key"
3 = "Decrypting the blocks"
4 = "Checking integrity"

[ui.tui.fx.buy]
title = "Purchase: {name}"
status = "Purchase in progress, {percent}% done"
status_done = "Purchase complete, {percent}% done"
debit = "Debit: {price}"
balance = "Balance: {balance}"

[ui.tui.fx.buy.phase]
1 = "Checking the balance"
2 = "Sending the payment"
3 = "Receipt confirmed"

[ui.options]
title = "== Settings =="
col_setting = "Setting"
col_value = "Value"
col_choices = "Choices"
at_launch = "at launch"
hint = "Changes last for this game. `options save` keeps them in {file}."
hint_off = "Changes last for this game (started with --no-save: nothing is written)."
usage = "Usage: `options [setting value]`, or `options save`. Example: `options verbosity full`."
verbosity_usage = "Usage: `verbosity [brief|normal|full]`. Example: `verbosity full`."
verbosity_now = "Verbosity: {value}."
changed = "Setting changed: {setting} = {value}."
unknown_setting = "Unknown setting: {setting}. See `options`."
bad_value = "Unknown value for {setting}: {value}. Choices: {choices}."
fixed = "{setting} is set at launch: `--screen-reader`, or the key of the same name in settings.toml."
floor = "Screen-reader mode never goes below \"normal\"."
no_colour = "No colour here (terminal or mode): the palette will be used when there is some."
display_later = "Display applies from the next launch (`options save` keeps it)."
saved = "Settings kept in {file}."
save_failed = "Settings not kept: {reason}."
save_damaged = "The file {file} is damaged: it is left as it is. See `neon-hack --print-settings`."
save_nothing = "Nothing to keep: no setting was changed during this game."
save_off = "Started with --no-save: nothing is written."

[ui.export]
done = "Transcript written to {file} ({lines} {lines|line|lines})."
need_name = "Nothing is written by itself with --no-save: give a file name, `export <file>`."
exists = "{file} already exists: pick another name, nothing was written."
failed = "Could not write the transcript: {reason}"

[ui.load]
title = "== Saves =="
col_save = "save"
col_player = "player"
col_turn = "actions"
damaged = "damaged ({reason})"
hint = "`load <save>` replaces the game under way by one of these (it asks first)."
usage = "Usage: `load` lists the saves, `load <save>` loads one."
unknown = "There is no save called {save}: use auto, checkpoint-1 to checkpoint-{checkpoints}, or slot-1 to slot-{slots}."
unreadable = "That save is damaged and no previous copy works ({details}). Nothing was changed."
confirm = "Load {save} ({player}, {turn} {turn|action|actions})?"
warning = "Loading replaces the game under way: what you played since your last save is lost."
done = "Loaded {save}."
cancelled = "Nothing was loaded."
failed = "Could not load that save: {reason}. Nothing was changed."

[ui.fallback]
too_small = "The terminal is too small ({width}x{height}, at least {min_width}x{min_height} needed): using the line-by-line interface."
no_terminal = "The full-screen interface needs a terminal: using the line-by-line interface."
dumb = "This terminal (TERM=dumb) cannot show the full-screen interface: using the line-by-line interface."
no_tui = "This build has no full-screen interface: using the line-by-line interface."

[ui.mode]
title = "How do you want to play?"
full = "[1] Full screen (recommended)"
plain = "[2] Line by line (plain text, works everywhere)"
screen_reader = "[3] Screen reader (plain text, no colour, wording made to be read aloud)"
prompt = "Your choice [1]: "
invalid = "Answer 1, 2 or 3."
saved = "Your choice is saved in {file}. --tui, --plain and --screen-reader override it."
not_saved = "Your choice could not be saved ({reason}): it holds for this session only."

[gauge]
trace = "Trace"

[band]
