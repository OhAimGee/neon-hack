# Texts of the interface (ui, gauges, bands, contacts), English.
# Keys are the table path plus the name; `name@sr` and `name@ascii` are variants of `name`.
# Templates: {name}, and {count|singular|plural} (see docs/design/architecture-rust.md, section 6).

[ui]
raw = "{value}"
tagged = "{tag} {text}"
say = "{speaker} » {text}"
"say@ascii" = "{speaker}: {text}"
"say@sr" = "{speaker}: {text}"
invalid_input = "That input is not valid here."
invalid_choice = "Choose one of the listed numbers or names."
invalid_confirm = "Please answer yes or no."
eof = "Input closed: ending the session."

[ui.tag]
alert = "[ALERT]"
reward = "[Reward]"
error = "[Error]"

[ui.gauge]
up = "{gauge} +{delta} ({from} → {to}, {band})."
"up@sr" = "{gauge} up by {delta}, from {from} to {to}, level {band}."
down = "{gauge} -{delta} ({from} → {to}, {band})."
"down@sr" = "{gauge} down by {delta}, from {from} to {to}, level {band}."

[ui.prompt]
command = "> "
choice = "? "
text = "{label}: "
text_default = "{label} [{default}]: "
confirm = "{question} {hint} "
continue = "[Enter] to continue"

[ui.hint]
yes_default = "[Y/n]"
no_default = "[y/N]"

[ui.choice]
unavailable = "{label} ({reason})"

[ui.sr]
cell = "{column}: {value}"

[ui.tui]
too_small = "Terminal too small ({width}x{height}): at least {min_width}x{min_height} needed."
"too_small@sr" = "Terminal too small: {width} columns by {height} lines, at least {min_width} by {min_height} needed."
press_key = "Press any key to leave."
log_title = "{terminal^}"
panel_title = "{panel^}"
help = "Tab complete | Up/Down history | PgUp/PgDn scroll | Ctrl+C quit"
scrolled = "[Scrolled back: {rows} {rows|line|lines} below. End or Esc to return.]"

[ui.fallback]
too_small = "The terminal is too small ({width}x{height}, at least {min_width}x{min_height} needed): using the line-by-line interface."
no_terminal = "The full-screen interface needs a terminal: using the line-by-line interface."
dumb = "This terminal (TERM=dumb) cannot show the full-screen interface: using the line-by-line interface."
no_tui = "This build has no full-screen interface: using the line-by-line interface."

[ui.mode]
title = "How do you want to play?"
full = "[1] Full screen (recommended)"
plain = "[2] Line by line (plain text, works everywhere)"
screen_reader = "[3] Screen reader (plain text, no colour, wording made to be read aloud)"
prompt = "Your choice [1]: "
invalid = "Answer 1, 2 or 3."
saved = "Your choice is saved in {file}. --tui, --plain and --screen-reader override it."
not_saved = "Your choice could not be saved ({reason}): it holds for this session only."

[gauge]
trace = "Trace"

[band]
calm = "calm"
tense = "tense"
critical = "critical"

[contact.echo7]
name = "ECHO-7"

[ui.save]
folder = "Saves folder: {folder}"
resumed = "Resuming your saved game. Start over with --new."
resumed_backup = "The latest save was damaged: resuming from the previous copy."
failed = "Could not save the game: {reason}"
slot_done = "Game saved in slot {slot}."
disabled = "Saving is turned off (--no-save)."
missing = "There is no save called {save}."
unreadable = "The save is damaged and no previous copy works ({details}). Nothing was changed: start a new game with --new."
other_game = "This is a save of {other}, not of {this}. To play {other}, run `{command}`; to start {this} over, use --new (this save is kept)."
none = "No saved game."
list_entry = "{save}: {player}, {turn} {turn|action|actions}"
list_damaged = "{save}: damaged ({reason})"

[ui.game]
campaign = "the campaign"
demo = "the demo"

[ui.settings]
damaged = "settings.toml could not be used ({reason}): the default settings are in effect. The file was not changed."

[error]
unknown_command = "Unknown command: {command}. See `help`."

[error.wrong_context]
run = "Only during a {run}."
hub = "Not during a {run}."
tui = "Only in full screen."

[error.arg]
missing = "Missing argument. {usage}"
unknown = "Unknown {kind}: {value}. See `{see}`."
ambiguous = "\"{value}\" fits several {kind}s: {candidates}."
"ambiguous@sr" = "{value} fits several {kind}s: {candidates}."
unavailable = "{name} is unavailable: {reason}."
