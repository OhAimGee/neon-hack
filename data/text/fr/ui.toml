# Texts of the interface (ui, gauges, bands, contacts), French.
# Keys are the table path plus the name; `name@sr` and `name@ascii` are variants of `name`.
# Templates: {name}, and {count|singular|plural} (see docs/design/architecture-rust.md, section 6).

[ui]
raw = "{value}"
tagged = "{tag} {text}"
say = "{speaker} » {text}"
"say@ascii" = "{speaker}: {text}"
"say@sr" = "{speaker}: {text}"
invalid_input = "Cette saisie n'est pas valable ici."
invalid_choice = "Choisissez un des numéros ou des noms listés."
invalid_confirm = "Répondez par oui ou par non."
eof = "Entrée fermée : fin de la session."

[ui.tag]
alert = "[ALERTE]"
reward = "[Gain]"
error = "[Erreur]"

[ui.gauge]
up = "{gauge} +{delta} ({from} → {to}, {band})."
"up@sr" = "{gauge} en hausse de {delta}, de {from} à {to}, niveau {band}."
down = "{gauge} -{delta} ({from} → {to}, {band})."
"down@sr" = "{gauge} en baisse de {delta}, de {from} à {to}, niveau {band}."

[ui.prompt]
command = "> "
choice = "? "
text = "{label} : "
text_default = "{label} [{default}] : "
confirm = "{question} {hint} "
continue = "[Entrée] pour continuer"

[ui.hint]
yes_default = "[O/n]"
no_default = "[o/N]"

[ui.choice]
unavailable = "{label} ({reason})"

[ui.sr]
cell = "{column} : {value}"

[ui.tui]
too_small = "Terminal trop petit ({width}x{height}) : {min_width}x{min_height} au minimum."
press_key = "Appuyez sur une touche pour quitter."

[gauge]
trace = "Trace"

[band]
calm = "calme"
tense = "tendu"
critical = "critique"

[contact.echo7]
name = "ECHO-7"

[ui.save]
folder = "Dossier des sauvegardes : {folder}"
resumed = "Reprise de votre partie sauvegardée. Pour recommencer : --new."
resumed_backup = "La dernière sauvegarde était abîmée : reprise depuis la copie précédente."
failed = "Sauvegarde impossible : {reason}"
slot_done = "Partie sauvegardée dans l'emplacement {slot}."
disabled = "La sauvegarde est désactivée (--no-save)."
missing = "Il n'y a pas de sauvegarde nommée {save}."
unreadable = "La sauvegarde est abîmée et aucune copie précédente ne fonctionne ({details}). Rien n'a été modifié : lancez une nouvelle partie avec --new."
none = "Aucune partie sauvegardée."
list_entry = "{save} : {player}, {turn} {turn|action|actions}"
list_damaged = "{save} : abîmée ({reason})"

[ui.settings]
damaged = "settings.toml est inutilisable ({reason}) : les réglages par défaut s'appliquent. Le fichier n'a pas été modifié."

[error]
unknown_command = "Commande inconnue : {command}. Voir `help`."

[error.wrong_context]
run = "Seulement pendant une {run}."
hub = "Pas pendant une {run}."
tui = "Seulement en plein écran."

[error.arg]
missing = "Argument manquant. {usage}"
unknown = "Inconnu : {kind} {value}. Voir `{see}`."
ambiguous = "« {value} » convient à plusieurs {kind}s : {candidates}."
"ambiguous@sr" = "{value} convient à plusieurs {kind}s : {candidates}."
unavailable = "{name} est indisponible : {reason}."
