# Textes du jeu de campagne (le hub), français : aide, fiches, listes, invites, résultats.
# Clés = chemin de la table + nom ; `nom@sr` et `nom@ascii` sont des variantes de `nom`.
# Les termes du glossaire ne s'écrivent jamais ici : ils arrivent en arguments (`{quest}`,
# `{net}`...), et `{terme^}` ouvre une phrase par une majuscule. L'interface est neutre (ni tu
# ni vous : infinitif et tournures impersonnelles). Les textes de narration (titres, dialogues,
# messages, fragments...) ne sont pas ici : leurs clés sont dérivées des données (world_*.toml).

