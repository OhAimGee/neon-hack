# Thresholds of the balancing harness (docs/spec/neon-sim.md, section 5).
#
# P is a barrier: `neon-sim check` fails when it does not hold. O is an objective: it is
# reported and does not fail the check, until the owner validates its value and it is promoted
# to P (section 8 of the spec). The numbers are starting hypotheses [H] of the spec: the
# harness never changes game data, a person does, with a report to justify it.

# T1: the optimist finishes the campaign, whatever its decisions, and every ending is reached.
[t1]
level = "P"
per_mille = 1000
endings = ["e1a", "e1b", "e2", "e3", "e4"]

# T2: every site can be won with the deck every player has, at every difficulty.
[t2]
level = "P"

# T3: the best plan of a site takes between 3 and 12 turns. An objective for now: the
# spec's hypothesis is not met by the shipped sites (their best plans take 1 to 4 turns), and
# it is for the owner to say whether the bounds or the sites change (docs/ROADMAP.md, R6).
[t3]
level = "O"
min_turns = 3
max_turns = 12

# T4: the room the minimal deck leaves under the cap of the Trace. The order between
# difficulties is a barrier; the gap between Story and Normal and the bounds at Normal are
# objectives (the shipped sites leave more room than the spec's hypothesis asks for).
[t4]
order_level = "P"
gap_level = "O"
story_over_normal = 10
bounds_level = "O"
normal_min = 25
normal_max = 70
