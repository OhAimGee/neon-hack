# Thresholds of the balancing harness (docs/spec/neon-sim.md, section 5).
#
# P is a barrier: `neon-sim check` fails when it does not hold. O is an objective: it is
# reported and does not fail the check, until the owner validates its value and it is promoted
# to P (section 8 of the spec). The numbers are the starting hypotheses [H] of the spec; the
# harness never changes game data, a person does, with a report to justify it.

# T1: the optimist finishes the campaign, whatever its decisions, and every ending is reached.
[t1]
level = "P"
per_mille = 1000
endings = ["e1a", "e1b", "e2", "e3", "e4"]

# T2: every site can be won with the deck every player has, at every difficulty.
[t2]
level = "P"

# T3: the best plan of a site takes between 3 and 12 turns, at the reference difficulty. The
# other difficulties scale from it (Story gives a cycle and halves the Trace; Expert and
# Hardcore press the player to go faster), so their plans are not bound. It starts at tier 2:
# the first site is the tutorial, short and forgiving on purpose.
[t3]
level = "P"
difficulty = "normal"
from_tier = 2
min_turns = 3
max_turns = 12

# T4: the room the minimal deck leaves under the cap of the Trace. The order between
# difficulties holds for every site. The gap between Story and Normal and the bounds at Normal
# start at tier 2, like T3.
[t4]
order_level = "P"
from_tier = 2
gap_level = "P"
story_over_normal = 10
bounds_level = "P"
normal_min = 25
normal_max = 70
