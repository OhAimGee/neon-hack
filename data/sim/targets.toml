# Thresholds of the balancing harness (docs/spec/neon-sim.md, section 5).
#
# P is a barrier: `neon-sim check` fails when it does not hold. O is an objective: it is
# reported and does not fail the check, until the owner validates its value and it is promoted
# to P (section 8 of the spec). The numbers are the starting hypotheses [H] of the spec; the
# harness never changes game data, a person does, with a report to justify it.

# T1: the optimist finishes the campaign, whatever its decisions, and every ending is reached.
[t1]
level = "P"
per_mille = 1000
endings = ["e1a", "e1b", "e2", "e3", "e4"]

# T2: every site can be won with the deck every player has, at every difficulty.
[t2]
level = "P"

# T3: the best plan of a site takes between 3 and 12 turns, at the reference difficulty. The
# other difficulties scale from it (Story gives a cycle and halves the Trace; Expert and
# Hardcore press the player to go faster), so their plans are not bound. It starts at tier 3:
# the first two sites are the tutorial, short and forgiving on purpose (the player has three
# cycles and the first deck).
[t3]
level = "P"
difficulty = "normal"
from_tier = 3
min_turns = 3
max_turns = 12

# T4: the room the minimal deck leaves under the cap of the Trace. The order between
# difficulties holds for every site. The gap between Story and Normal and the bounds at Normal
# start at tier 3, like T3.
[t4]
order_level = "P"
from_tier = 3
gap_level = "P"
story_over_normal = 10
bounds_level = "P"
normal_min = 25
normal_max = 70

# T5: a reasonable player (the prudent bot) at Normal: it finishes the campaign, and a share of
# its intrusions burns out, never many in a row on the same site. Objectives: the numbers are
# the starting hypotheses of the spec and the measure of the shipped sites is for the owner.
[t5]
level = "O"
finished_per_mille_min = 950
burned_per_mille_min = 100
burned_per_mille_max = 250
longest_streak_max = 4

# T6: a reckless player (the strongest program, no cloak, no forecast) is the floor of the
# difficulty: it does not get through Expert, and gets through Story.
[t6]
level = "O"
expert_finished_per_mille_max = 100
story_finished_per_mille_min = 800

# T10: how long a campaign lasts for the prudent bot at Normal, in command lines (1500 to
# 2500 is about 4 to 5 hours at the reference pace of the spec), and how much of it is spent
# in an intrusion.
[t10]
level = "O"
commands_min = 1500
commands_max = 2500
in_intrusion_per_mille_max = 300

# T11: the Notoriety at Normal: the prudent bot stays at most Watched at the median (under 50)
# and is Hunted (80 and more) in a tenth of its games at most; the reckless bot is Hunted in
# half of them at least.
[t11]
level = "O"
prudent_median_max = 49
prudent_hunted_per_mille_max = 100
reckless_hunted_per_mille_min = 500

# T14: Story mode is played to its end without any tactic: the story bot plays what costs a
# single turn and skips the rest (`skip` takes everything on the site). It is Hunted in a seventh
# of its games at most: the betrayal branches of the story force the heat to 85 by themselves
# (`heat_force` in quests.toml), the intrusions do not.
[t14]
level = "O"
finished_per_mille_min = 950
hunted_per_mille_max = 150

# T12: the monkey (random inputs, valid and hostile, damaged saves) finds no panic, no game that
# cannot be left, no save that does not round trip. A report of fewer games than the quick check
# of the spec (100) says nothing.
[t12]
level = "P"
min_games = 100

# T8: anti-farm. The farmer sends again, as they were sent, the conversations, the readings, the
# decryptions and the links at every quest done, and at the end the sites, the purchases and the
# cover too. It ends with no more credits and no more reputation than the optimist, on the
# same games. A report where it sent nothing again says nothing.
[t8]
level = "P"
min_repeated = 1

# T7: the economy. What the stall costs, as a share of the most a campaign pays (the spec
# wants 120 to 150 %: more to buy than to earn), the main quests of each tier paying for the
# item of the next, not everything buyable, and a hoarder (who buys nothing from the stall)
# not able to finish. Objective: the numbers are the starting hypotheses of the spec and the
# measure of the shipped content is for the owner.
[t7]
level = "O"
catalogue_percent_min = 120
catalogue_percent_max = 150
hoarder_finished_per_mille_max = 0

# T9: no program is dominated. Each program of the decks lowers the margin of some site when it
# is taken out (or a site cannot be won without it). Objective: the spec makes it a barrier, the
# owner decides what to do with the programs that are worth nothing (a gain, a price, a removal).
[t9]
level = "O"

# T13: performance, read from the timings of `neon-sim bench` (not from a canonical report: the
# timings vary from one machine to the next). A thousand campaigns in a minute at most, the
# bounded resolution of a site in fifty milliseconds at most, and the same bytes from one run
# to the next.
[t13]
level = "O"
thousand_campaigns_millis_max = 60000
resolution_micros_max = 50000
deterministic = true
