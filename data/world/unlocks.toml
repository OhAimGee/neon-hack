# When the commands of the game open (docs/spec/commands.md, section 6). A command that has
# no rule here is open from the start. `when` is a condition of the mission language, the
# same as the quests use; `reason` is the text key said while the command is closed ("Not
# yet: find R4Z0R."). The rules are data: nothing in the Rust code knows when a command opens.
# Every `command` must be a command of the game's table (checked when the content is loaded).

# The first intrusion is part of the first quest (M01).
[[unlock]]
command = "hack"
when = { kind = "any", of = [
    { kind = "quest", id = "m01", is = "active" },
    { kind = "quest", id = "m01", is = "completed" },
] }
reason = "unlock.hack"

# Covering one's tracks is also part of M01 (its last objective is any cover command), so
# `laylow` cannot wait for the notoriety to leave its first band as the spec first proposed.
[[unlock]]
command = "laylow"
when = { kind = "any", of = [
    { kind = "quest", id = "m01", is = "active" },
    { kind = "quest", id = "m01", is = "completed" },
] }
reason = "unlock.laylow"

# R4Z0R's stall opens when R4Z0R is found (end of M01). It stays open afterwards whatever
# happens to him: a closed shop after a betrayal (D1) would make the later items unreachable.
[[unlock]]
command = "shop"
when = { kind = "contact", id = "r4z0r", is = ["available", "busy", "compromised", "hostile", "silenced", "dead"] }
reason = "unlock.shop"

[[unlock]]
command = "buy"
when = { kind = "contact", id = "r4z0r", is = ["available", "busy", "compromised", "hostile", "silenced", "dead"] }
reason = "unlock.buy"

# The first message arrives with the end of M01.
[[unlock]]
command = "messages"
when = { kind = "quest", id = "m01", is = "completed" }
reason = "unlock.messages"

[[unlock]]
command = "read"
when = { kind = "quest", id = "m01", is = "completed" }
reason = "unlock.read"

# The first document circulates from level 2, which M01 grants.
[[unlock]]
command = "archives"
when = { kind = "quest", id = "m01", is = "completed" }
reason = "unlock.archives"

[[unlock]]
command = "decrypt"
when = { kind = "quest", id = "m01", is = "completed" }
reason = "unlock.decrypt"

# The first contract on offer is S06; once offered, a contract stays offered, accepted or done.
[[unlock]]
command = "accept"
when = { kind = "any", of = [
    { kind = "quest", id = "s06", is = "available" },
    { kind = "quest", id = "s06", is = "active" },
    { kind = "quest", id = "s06", is = "completed" },
] }
reason = "unlock.accept"

# The neural link with a companion is asked from the fourth chapter on (S07, M09). `link` is
# the hand-made stand-in for the companion slot of the tactical run (R4), which raises the
# same levels by itself (decision R-17).
[[unlock]]
command = "link"
when = { kind = "flag", name = "chapter", at_least = 4 }
reason = "unlock.link"
