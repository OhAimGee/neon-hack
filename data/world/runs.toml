# The tactical intrusion of each site, and the deck of each tier (docs/spec/run-screen.md,
# docs/spec/solver.md). The rules are in `neon_engine::run`; this file is only the graphs.
#
# A node is numbered from 1 in the order it is written; `link` and `patrol` name nodes by number.
# `ice` = { family = network|encryption|human|ai_guardian, strength = 1..6 }; `loot` is
# `objective` (taking all of them opens `jackout`), `intel` (what social engineering needs) or
# `extra`; `files` are the files of the site that taking the loot extracts. A patrol walks its
# `route` one node per turn; with an `anchor` it is the guardian process of that node and stops
# once its ICE is open. The names of the nodes are texts: `site.<id>.node.<n>.name`.

# The deck of each tier. Programs come from the shop later; until then the tier decides.

[[kit]]
tier = 1
cycles = 3
programs = ["brute", "backdoor", "cloak"]

[[kit]]
tier = 2
cycles = 3
programs = ["brute", "backdoor", "cloak", "exploit", "decrypt", "spoof"]

[[kit]]
tier = 3
cycles = 4
programs = ["brute", "backdoor", "cloak", "exploit", "decrypt", "spoof", "quantum", "social"]

[[kit]]
