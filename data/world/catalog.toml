# Catalog of the things quests talk about: sites, files, items, contacts, readables, commands.
# Ids are stable lowercase text. The names of the original game are kept as `legacy_*` fields
# for traceability only; player-facing text lives in the per-language catalogs, keyed by id.
# Source of the gates: narrative bible 4.6 (palier mini of each site) and 5.1 (shop tiers).

# ---------------------------------------------------------------------------- sites
# `unlock.tier` is the "palier mini" of the bible. `relay` must be compromised first.
# `first_breach` is an assumption of the first prototype: without it, nothing pays enough reputation before M03.

