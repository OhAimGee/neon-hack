[workspace]
resolver = "3"
members = ["crates/neon-engine", "crates/neon-cli", "crates/neon-sim"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Floor imposed by ratatui 0.30.2 (docs/design/tui-and-accessibility.md, section 7.1).
rust-version = "1.88"
license = "CC0-1.0"
repository = "https://github.com/OhAimGee/neon-hack"
publish = false

# Every version is declared here once; a bump is a single line. Entries not used yet
# are declared for the phases that need them (docs/ROADMAP.md).
[workspace.dependencies]
neon-engine = { path = "crates/neon-engine" }

serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
toml = "1.1.6"
directories = "6.0.0"
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
anstream = "1.0.0"
signal-hook = "0.4.5"

proptest = "1.11.0"
insta = "1.49.0"
portable-pty = "0.9.0"
vt100 = "0.16.2"
tempfile = "3.27.0"

# One lint table for the whole workspace: the union of the sets proposed by the
# architecture and delivery documents (docs/design/CROSS-CHECK.md, point 16).
[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# No hidden panics or silent truncation in code that ends up in a save file.
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
# Only the plain frontend may write to the console: a stray println! corrupts the TUI.
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Purity rules of the engine live in crates/neon-engine/clippy.toml.
disallowed_types = "deny"
disallowed_methods = "deny"
disallowed_macros = "deny"
# Pedantic lints that cost more than they bring here.
too_many_lines = "allow"
similar_names = "allow"
return_self_not_must_use = "allow"

[profile.release]
# Without this, 0 - 1 on a u32 wraps to 4_294_967_295 credits in a release build.
overflow-checks = true
