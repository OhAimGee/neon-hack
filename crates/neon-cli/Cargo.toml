[package]
name = "neon-cli"
description = "The neon-hack binary: command line, directories and frontends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "neon-hack"
path = "src/main.rs"

[features]
# The full-screen interface. `--no-default-features` builds the plain frontend only,
# and CI checks that this build keeps working.
default = ["tui"]
tui = ["dep:ratatui", "dep:unicode-width"]

[dependencies]
neon-engine = { workspace = true }
clap = { workspace = true }
directories = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
ratatui = { workspace = true, optional = true }
unicode-width = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
