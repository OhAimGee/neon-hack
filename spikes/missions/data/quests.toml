# Quests of the bible: the whole main line M01-M14 and the side quests the endings,
# the decisions and the conditions of chapter 4 need (S06 S07 S08 S10 S11 S12 S13 S14 S16).
# Order = prerequisites first. `tier` is the reference tier P of the rewards (palier column of
# the bible); `unlock.tier` is the gate. Tiers are granted by the main line (`grant_tier`).
# Text keys are derived from the ids (quest.<id>.title, .obj.N ...): no text here.
#
# Objective kinds: talk buy compromise extract open link reputation use site_state pay
# choice heat_end_below heat_peak_below any_of. Indicators: optional, secret, when, id.

# =========================================================================== M01
# Bible 5.3: 7 objectives. #5 `REACH_TIER(2)` cannot be met (this very quest grants tier 2):
# replaced by a first talk with ECHO-7.
[[quest]]
id = "m01"
code = "INTRO_TUTORIAL"
kind = "main"
chapter = 1
giver = "echo7"
tier = 1
reward = { credits = "M", reputation = "S" }
[[quest.objective]]
kind = "use"
command = "quests"
[[quest.objective]]
kind = "use"
command = "help"
[[quest.objective]]
kind = "use"
command = "scan"
[[quest.objective]]
kind = "use"
command = "status"
[[quest.objective]]
kind = "talk"
contact = "echo7"
[[quest.objective]]
kind = "compromise"
site = "localhost"
[[quest.objective]]
kind = "use"
group = "cover"
[[quest.on_complete]]
then = [
    { kind = "grant_tier", tier = 2 },
    { kind = "unlock", readable = "mail-welcome" },
    { kind = "set_contact_state", contact = "r4z0r", state = "available" },
]

