# =========================================================================== M07
# Sabotage. The secret objective only changes how hard the betrayal B1 hits: forced heat 65
# when the player knew (S06 done, or the honeypot found), 85 otherwise.
[[quest]]
id = "m07"
code = "CORPORATE_SABOTAGE"
kind = "main"
chapter = 3
giver = "phoenix"
tier = 5
unlock = { tier = 5 }
prereq = ["m06"]
reward = { credits = "L", reputation = "L" }
[[quest.objective]]
kind = "site_state"
site = "banking-network"
mark = "virus"
[[quest.objective]]
kind = "site_state"
site = "research-lab"
mark = "backdoor"
[[quest.objective]]
kind = "extract"
site = "research-lab"
file = "prototype_specs"
[[quest.objective]]
kind = "heat_end_below"
below = 60
[[quest.objective]]
id = "honeypot"
kind = "site_state"
site = "research-lab"
mark = "analyzed"
secret = true
optional = true
[[quest.on_complete]]
then = [
    { kind = "unlock", readable = "f15" },
    { kind = "unlock", readable = "cs04" },
    { kind = "set_flag", flag = "sabotage_done", value = true },
    { kind = "set_flag", flag = "phoenix_state", value = "compromised" },
    { kind = "set_flag", flag = "hub", value = "safehouse" },
    { kind = "set_contact_state", contact = "phoenix", state = "compromised" },
    { kind = "set_contact_state", contact = "insider", state = "available" },
]
[[quest.on_complete]]
when = { kind = "any", of = [
    { kind = "quest", id = "s06", is = "completed" },
    { kind = "objective", quest = "m07", id = "honeypot" },
] }
then = [{ kind = "heat_force", value = 65 }]
[[quest.on_complete]]
when = { kind = "not", of = { kind = "any", of = [
    { kind = "quest", id = "s06", is = "completed" },
    { kind = "objective", quest = "m07", id = "honeypot" },
] } }
then = [{ kind = "heat_force", value = 85 }]

