# =========================================================================== M10
# The Broker. D1. Objective 2 mixes three ways to pay; the `pay` alternatives are guarded by
# the retainer of S11 (half price = one size down). The ledger was already extracted in M04,
# so `betray` is open from the start (open point in the README).
[[quest]]
id = "m10"
code = "SHADOW_BROKER"
kind = "main"
chapter = 5
giver = "broker"
tier = 5
unlock = { tier = 5 }
prereq = ["m09"]
[[quest.on_open]]
then = [{ kind = "set_flag", flag = "chapter", value = 5 }]
[[quest.objective]]
kind = "talk"
contact = "broker"
[[quest.objective]]
kind = "any_of"
of = [
    { id = "pay", kind = "pay", amount = "L", when = { kind = "flag", name = "broker_retainer", is = false } },
    { id = "pay_retainer", kind = "pay", amount = "M", when = { kind = "flag", name = "broker_retainer", is = true } },
    { id = "betray", kind = "extract", site = "underground-market", file = "black_ledger" },
    { id = "steal", kind = "extract", site = "shadow-exchange" },
]
[[quest.objective]]
kind = "choice"
decision = "d1"
[[quest.on_complete]]
then = [
    { kind = "grant_tier", tier = 6 },
    { kind = "unlock", readable = "cs07" },
]

