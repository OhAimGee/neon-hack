name: Balancing (nightly)

on:
  schedule:
    # Every night at 02:43 UTC.
    - cron: "43 2 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: "Seeds of the games: a number or a range such as 1..=20"
        default: "1"
      plans:
        description: "Which decisions the optimist takes: all or representative"
        default: "all"

permissions:
  contents: read
  # To fetch the reports of the night before (the artifact of the previous run).
  actions: read

concurrency:
  group: sim-nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  sim-nightly:
    name: every bot, every threshold
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Play every bot and check every threshold
        env:
          SEEDS: ${{ inputs.seeds || '1' }}
          PLANS: ${{ inputs.plans || 'all' }}
        run: |
          set -o pipefail
          scripts/sim-nightly.sh target/sim-nightly 2>&1 | tee target/sim-nightly.log
      - name: Sum up the thresholds
        if: always()
        run: |
          {
            echo '### Balancing thresholds'
            echo '```'
            grep -E '^\[(ok  |FAIL|warn)' target/sim-nightly.log || tail -n 40 target/sim-nightly.log
            echo '```'
            if grep -q '^Games to replay:' target/sim-nightly.log; then
              echo '### Games to replay'
              echo '```'
              sed -n '/^Games to replay:/,$p' target/sim-nightly.log | tail -n +2
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Compare with the night before
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/sim-drift.sh target/sim-nightly target/sim-previous 2>&1 | tee target/sim-drift.log
          moved=$(grep -c '^\[drift\] .* -> ' target/sim-drift.log || true)
          if [ "${moved:-0}" -gt 0 ]; then
            echo "::warning title=Balancing drift::${moved} indicators moved by more than 5 % since the night before (see the job summary)"
          fi
          {
            echo '### Drift since the night before'
            echo '```'
            cat target/sim-drift.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The reports of the night (the canonical JSON, the timings and the log) are kept for a
      # month, to compare a night with the one before. Referenced by its major tag, not by a
      # commit: the owner chose not to pin this action.
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sim-nightly-${{ github.run_id }}
          path: |
            target/sim-nightly/
            target/sim-nightly.log
            target/sim-drift.log
          if-no-files-found: warn
          retention-days: 30
